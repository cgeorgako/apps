<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CardScan">
<title>CardScan — Σαρωτής Επαγγελματικών Καρτών</title>
<link rel="manifest" href="cardscan.webmanifest">
<link rel="apple-touch-icon" href="cardscan-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel-2:#1c232d; --line:#2a323d;
    --txt:#e6edf3; --txt-dim:#8b97a7;
    --acc:#ff7a18; --acc-2:#ff9a3c; --acc-soft:rgba(255,122,24,.12);
    --ok:#10b981; --ok-soft:rgba(16,185,129,.15);
    --danger:#ef4444; --danger-soft:rgba(239,68,68,.14);
    --info:#3b82f6; --info-soft:rgba(59,130,246,.15);
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:var(--sans); background:var(--bg); color:var(--txt);
    background-image:
      radial-gradient(circle at 15% 0%,rgba(255,122,24,.06),transparent 42%),
      linear-gradient(#1b212b 1px,transparent 1px),
      linear-gradient(90deg,#1b212b 1px,transparent 1px);
    background-size:auto,30px 30px,30px 30px;
    min-height:100vh; padding-bottom:calc(84px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:720px; margin:0 auto; padding:0 16px;}

  /* Header */
  header.topbar{
    position:sticky; top:0; z-index:20;
    background:rgba(14,17,22,.86); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
    margin:0 -16px 18px; display:flex; align-items:center; gap:12px;
  }
  .topbar .logo{width:38px;height:38px;border-radius:10px;flex-shrink:0;}
  .topbar .titles{flex:1; min-width:0;}
  .topbar h1{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.1;}
  .topbar .maker{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);}
  .iconbtn{
    width:40px;height:40px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--txt);font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s;
  }
  .iconbtn:hover{border-color:var(--acc);color:var(--acc);}

  /* Back button row */
  .backrow{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .backbtn{background:none;border:none;color:var(--acc);font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:var(--sans);}
  .viewtitle{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:2px 0 4px;}
  .viewsub{color:var(--txt-dim);font-size:13px;margin-bottom:18px;line-height:1.5;}

  /* Search */
  .search{position:relative;margin-bottom:18px;}
  .search input{
    width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:13px 14px 13px 42px;color:var(--txt);font-size:15px;font-family:var(--sans);
  }
  .search input:focus{outline:none;border-color:var(--acc);}
  .search::before{content:"🔍";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.7;}

  /* Category grid */
  .cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  @media(min-width:520px){.cat-grid{grid-template-columns:repeat(3,1fr);}}
  .cat{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;cursor:pointer;transition:.16s;text-align:left;color:var(--txt);
    display:flex;flex-direction:column;gap:8px;min-height:104px;position:relative;overflow:hidden;
  }
  .cat:hover,.cat:active{border-color:rgba(255,122,24,.4);background:var(--panel-2);transform:translateY(-2px);}
  .cat .emoji{font-size:24px;}
  .cat .name{font-size:14px;font-weight:600;line-height:1.25;}
  .cat .count{
    font-family:var(--mono);font-size:11px;color:var(--acc);margin-top:auto;
    background:var(--acc-soft);padding:2px 8px;border-radius:20px;align-self:flex-start;
  }

  /* Section label */
  .section-label{
    font-family:var(--mono);font-size:12px;font-weight:600;text-transform:uppercase;
    letter-spacing:.1em;color:var(--txt-dim);margin:26px 0 12px;display:flex;align-items:center;gap:8px;
  }
  .section-label::after{content:"";flex:1;height:1px;background:var(--line);}

  /* Card list rows */
  .clist{display:flex;flex-direction:column;gap:10px;}
  .crow{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;
    display:flex;gap:12px;align-items:center;cursor:pointer;transition:.15s;text-align:left;color:var(--txt);width:100%;
  }
  .crow:hover,.crow:active{border-color:var(--acc);background:var(--panel-2);}
  .crow .thumb{
    width:56px;height:40px;border-radius:8px;flex-shrink:0;background:var(--panel-2);
    border:1px solid var(--line);object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--txt-dim);
  }
  .crow .cinfo{flex:1;min-width:0;}
  .crow .cname{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .crow .cmeta{font-size:12px;color:var(--txt-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .crow .cbadge{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--acc);background:var(--acc-soft);padding:2px 7px;border-radius:20px;flex-shrink:0;}

  .empty{text-align:center;color:var(--txt-dim);padding:48px 20px;font-size:14px;line-height:1.6;}
  .empty .big{font-size:44px;display:block;margin-bottom:12px;opacity:.6;}

  /* Buttons */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:14px 18px;border-radius:12px;font-size:15px;font-weight:600;font-family:var(--sans);
    border:1px solid var(--line);background:var(--panel);color:var(--txt);cursor:pointer;transition:.15s;width:100%;
  }
  .btn:hover{border-color:var(--acc);}
  .btn-primary{background:linear-gradient(135deg,var(--acc-2),var(--acc));border:none;color:#1a0e02;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-danger{background:var(--danger-soft);border-color:rgba(239,68,68,.4);color:#ff9b9b;}
  .btn-danger:hover{border-color:var(--danger);}
  .btn-ghost{background:transparent;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-row{display:flex;gap:10px;margin-top:8px;}

  /* Scan side capture */
  .sides{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
  @media(max-width:420px){.sides{grid-template-columns:1fr;}}
  .side{
    background:var(--panel);border:1.5px dashed var(--line);border-radius:var(--radius);
    aspect-ratio:1.6/1;position:relative;overflow:hidden;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:.15s;color:var(--txt-dim);
  }
  .side:hover{border-color:var(--acc);color:var(--acc);}
  .side.filled{border-style:solid;border-color:var(--line);color:var(--txt);}
  .side img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .side .side-emoji{font-size:30px;}
  .side .side-label{font-size:12.5px;font-weight:600;}
  .side .side-hint{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;}
  .side .retake{
    position:absolute;bottom:8px;right:8px;background:rgba(14,17,22,.85);border:1px solid var(--line);
    color:var(--txt);font-size:11px;padding:5px 10px;border-radius:20px;z-index:2;backdrop-filter:blur(4px);
  }
  .side .rotbtn{
    position:absolute;bottom:8px;left:8px;background:rgba(14,17,22,.85);border:1px solid var(--line);
    color:var(--txt);font-size:15px;width:32px;height:32px;line-height:1;border-radius:50%;z-index:3;
    cursor:pointer;backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;
  }
  .side .rotbtn:hover{border-color:var(--acc);color:var(--acc);}
  .side .side-proc{
    position:absolute;inset:0;z-index:4;background:rgba(14,17,22,.72);backdrop-filter:blur(2px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    font-size:12px;color:var(--txt);
  }
  .side .tag-side{
    position:absolute;top:8px;left:8px;background:rgba(14,17,22,.8);color:var(--acc);
    font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.1em;padding:3px 8px;border-radius:20px;z-index:2;
  }

  /* OCR progress */
  .ocr-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;}
  .ocr-box .ocr-status{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--txt-dim);margin-bottom:10px;}
  .spinner{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .bar{height:6px;background:var(--panel-2);border-radius:6px;overflow:hidden;}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc-2),var(--acc));transition:width .3s;}

  /* Form */
  .form{display:flex;flex-direction:column;gap:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--txt-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;}
  .field input,.field textarea,.field select{
    width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:12px 13px;color:var(--txt);font-size:15px;font-family:var(--sans);
  }
  .field textarea{resize:vertical;min-height:70px;line-height:1.5;}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--acc);}
  .field select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238b97a7' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 13px center;padding-right:36px;}
  .multi{display:flex;flex-direction:column;gap:8px;}
  .multi .mrow{display:flex;gap:8px;}
  .multi .mrow input{flex:1;}
  .multi .mrow button{width:44px;flex-shrink:0;background:var(--panel);border:1px solid var(--line);color:var(--txt-dim);border-radius:10px;font-size:18px;cursor:pointer;}
  .multi .mrow button:hover{border-color:var(--danger);color:var(--danger);}
  .addmini{background:none;border:1px dashed var(--line);color:var(--acc);border-radius:10px;padding:9px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans);}
  .addmini:hover{border-color:var(--acc);}

  /* Detail */
  .detail-imgs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
  .detail-imgs img{width:100%;border-radius:12px;border:1px solid var(--line);aspect-ratio:1.6/1;object-fit:cover;background:var(--panel);cursor:zoom-in;}
  .dfield{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;}
  .dfield .dico{font-size:18px;width:24px;text-align:center;flex-shrink:0;}
  .dfield .dwrap{flex:1;min-width:0;}
  .dfield .dlabel{font-size:11px;color:var(--txt-dim);text-transform:uppercase;letter-spacing:.05em;}
  .dfield .dval{font-size:15px;font-weight:500;margin-top:2px;word-break:break-word;}
  .dfield a.dval{color:var(--info);text-decoration:none;}
  .dfield .callbtn{background:var(--ok-soft);border:1px solid rgba(16,185,129,.35);color:var(--ok);width:38px;height:38px;border-radius:10px;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;text-decoration:none;}

  /* FAB */
  .fab{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;
    background:linear-gradient(135deg,var(--acc-2),var(--acc));color:#1a0e02;
    border:none;border-radius:30px;padding:15px 26px;font-size:15px;font-weight:700;font-family:var(--sans);
    box-shadow:0 8px 24px rgba(255,122,24,.35);cursor:pointer;display:flex;align-items:center;gap:8px;
  }
  .fab:active{transform:translateX(-50%) scale(.97);}

  /* Modal / lightbox */
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:none;align-items:center;justify-content:center;padding:20px;}
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%;max-height:90vh;border-radius:10px;}
  .lightbox .close{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;font-size:30px;color:#fff;background:none;border:none;cursor:pointer;}

  /* Toast */
  .toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));
    background:var(--panel-2);border:1px solid var(--line);color:var(--txt);
    padding:12px 18px;border-radius:12px;font-size:14px;z-index:70;box-shadow:0 8px 24px rgba(0,0,0,.4);
    opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.err{border-color:rgba(239,68,68,.5);}

  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px;}
  .chip{background:var(--panel);border:1px solid var(--line);color:var(--txt-dim);border-radius:20px;padding:6px 12px;font-size:12.5px;cursor:pointer;transition:.15s;}
  .chip:hover{border-color:var(--acc);}
  .chip.active{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);}

  .hidden{display:none!important;}
  .hint-inline{font-size:12px;color:var(--txt-dim);margin-top:6px;line-height:1.5;}
  footer.credit{margin-top:34px;text-align:center;font-family:var(--mono);font-size:11px;color:#5c6675;letter-spacing:.5px;padding:16px 0;border-top:1px solid var(--line);}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <img src="cardscan-icon.svg" alt="CardScan" class="logo">
    <div class="titles">
      <h1>CardScan</h1>
      <div class="maker">CG apps</div>
    </div>
    <button class="iconbtn" id="menuBtn" title="Επιλογές" aria-label="Επιλογές">⋯</button>
  </header>

  <main id="view"><!-- views render here --></main>

  <footer class="credit">CardScan · CG apps · τοπική αποθήκευση στη συσκευή σου</footer>
</div>

<!-- Floating action button -->
<button class="fab" id="fab" aria-label="Νέα σάρωση">📷 Σάρωση κάρτας</button>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="close" id="lightboxClose" aria-label="Κλείσιμο">×</button>
  <img id="lightboxImg" alt="">
</div>

<div class="toast" id="toast"></div>

<!-- Tesseract.js OCR από CDN -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
'use strict';

/* ============================================================
   CardScan — CG apps
   Single-file PWA: φωτογράφιση 2 όψεων κάρτας → OCR (ell+eng)
   → αυτόματη αναγνώριση στοιχείων → αποθήκευση ανά κατηγορία
   σε IndexedDB (μαζί με τις φωτογραφίες).
   ============================================================ */

/* ---------- Κατηγορίες ---------- */
const DEFAULT_CATEGORIES = [
  'Πισίνες','Οικοδόμος','Επιχρίσματα/Σοβάδες','Δάπεδα/Πλακάκια/Μάρμαρα',
  'Χρωματισμοί','Σκεπές','Πετράς','Δικηγόρος','Μηχανικός'
];
const CATEGORY_EMOJI = {
  'Πισίνες':'🏊','Οικοδόμος':'🧱','Επιχρίσματα/Σοβάδες':'🪣',
  'Δάπεδα/Πλακάκια/Μάρμαρα':'🪨','Χρωματισμοί':'🎨','Σκεπές':'🏠',
  'Πετράς':'⛏️','Δικηγόρος':'⚖️','Μηχανικός':'📐','Άλλο':'📁'
};
const OTHER = 'Άλλο';

function catEmoji(c){ return CATEGORY_EMOJI[c] || '📁'; }

function getCategories(){
  let extra=[];
  try{ extra = JSON.parse(localStorage.getItem('cardscan.categories')||'[]'); }catch(e){}
  const set=[];
  [...DEFAULT_CATEGORIES, ...extra].forEach(c=>{ if(c && !set.includes(c)) set.push(c); });
  set.push(OTHER);
  return set;
}
function addCustomCategory(name){
  name=(name||'').trim(); if(!name) return;
  let extra=[]; try{ extra=JSON.parse(localStorage.getItem('cardscan.categories')||'[]'); }catch(e){}
  if(!DEFAULT_CATEGORIES.includes(name) && !extra.includes(name) && name!==OTHER){
    extra.push(name); localStorage.setItem('cardscan.categories', JSON.stringify(extra));
  }
}

/* Λέξεις-κλειδιά για αυτόματη αναγνώριση κατηγορίας (accent-insensitive) */
const CATEGORY_KEYWORDS = {
  'Πισίνες':['πισιν','pool','spa','τζακουζι','jacuzzi','υδρομασαζ'],
  'Οικοδόμος':['οικοδομ','κτισιμ','μπετον','σκυροδεμ','builder','construction','κατασκευ','εργολαβ','αντιπλημμυρ','τουβλ'],
  'Επιχρίσματα/Σοβάδες':['σοβα','επιχρισμ','plaster','μαρμαροκονι','σπατουλαρισμ','γυψοσανιδ'],
  'Δάπεδα/Πλακάκια/Μάρμαρα':['πλακακ','δαπεδ','μαρμαρ','πλακοστρωσ','granite','γρανιτ','tile','ceramic','κεραμικ','πλακιδ','ψηφιδ','flooring'],
  'Χρωματισμοι':['χρωματ','βαφ','μπογι','ελαιοχρωμ','paint','ριπολιν','βερνικ'],
  'Σκεπές':['σκεπ','στεγ','κεραμιδ','roof','ταρατσ','μονωσ','στεγανοποι','ασφαλτοπαν'],
  'Πετράς':['λιθοδομ','πετρας','πετρα ','stone','λιθος','λιθικ','πετρωμ'],
  'Δικηγόρος':['δικηγορ','νομικ','lawyer',' law ','δικαστ','αδεια ασκησεως'],
  'Μηχανικός':['μηχανικ','engineer','αρχιτεκτ','architect','τοπογραφ','μηχανολογ','ηλεκτρολογ','πολιτικος μηχ','διπλ. μηχ','τεχνικο γραφειο']
};
/* διόρθωση κλειδιού με τόνο ώστε να ταιριάζει με πραγματική κατηγορία */
const KEYMAP_FIX = {'Χρωματισμοι':'Χρωματισμοί'};

function normalizeGr(s){
  return (s||'').toString().toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'') // αφαίρεση τόνων
    .replace(/ς/g,'σ');
}
function detectCategory(text){
  const t=normalizeGr(text);
  let best=null,bestScore=0;
  for(const [cat,words] of Object.entries(CATEGORY_KEYWORDS)){
    let score=0;
    for(const w of words){ if(t.includes(normalizeGr(w))) score++; }
    if(score>bestScore){ bestScore=score; best=cat; }
  }
  if(!best) return '';
  return KEYMAP_FIX[best] || best;
}

/* ---------- IndexedDB ---------- */
const DB_NAME='cardscan', DB_VER=1, STORE='cards';
let _db=null;
function openDB(){
  return new Promise((res,rej)=>{
    if(_db) return res(_db);
    const req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains(STORE)){
        const os=db.createObjectStore(STORE,{keyPath:'id'});
        os.createIndex('category','category',{unique:false});
        os.createIndex('createdAt','createdAt',{unique:false});
      }
    };
    req.onsuccess=e=>{ _db=e.target.result; res(_db); };
    req.onerror=e=>rej(e.target.error);
  });
}
function tx(mode){ return openDB().then(db=>db.transaction(STORE,mode).objectStore(STORE)); }
function dbAll(){ return tx('readonly').then(os=>new Promise((res,rej)=>{
  const out=[]; const c=os.openCursor();
  c.onsuccess=e=>{ const cur=e.target.result; if(cur){ out.push(cur.value); cur.continue(); } else res(out); };
  c.onerror=e=>rej(e.target.error);
})); }

/* ============================================================
   Επεξεργασία εικόνας κάρτας:
   EXIF προσανατολισμός → αυτόματο crop/ίσιωμα (OpenCV) → προεπεξεργασία OCR

// Φόρτωση εικόνας με σωστό EXIF προσανατολισμό
async function loadBitmap(file){
  if('createImageBitmap' in window){
    try{ return await createImageBitmap(file,{imageOrientation:'from-image'}); }catch(e){}
    try{ return await createImageBitmap(file); }catch(e){}
  }
  const url=URL.createObjectURL(file);
  try{ return await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; }); }
  finally{ setTimeout(()=>URL.revokeObjectURL(url),2000); }
}
function drawToCanvas(bmp,maxDim){
  let w=bmp.width||bmp.naturalWidth, h=bmp.height||bmp.naturalHeight;
  const scale=Math.min(1, maxDim/Math.max(w,h));
  const cw=Math.max(1,Math.round(w*scale)), ch=Math.max(1,Math.round(h*scale));
  const cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
  const ctx=cv.getContext('2d'); ctx.imageSmoothingQuality='high'; ctx.drawImage(bmp,0,0,cw,ch);
  return cv;
}
function canvasToJpeg(canvas,maxW,q){
  let w=canvas.width,h=canvas.height;
  if(w>maxW){ h=Math.round(h*maxW/w); w=maxW;
    const t=document.createElement('canvas'); t.width=w; t.height=h;
    const c=t.getContext('2d'); c.imageSmoothingQuality='high'; c.drawImage(canvas,0,0,w,h); canvas=t; }
  return canvas.toDataURL('image/jpeg',q||0.85);
}
function rotateCanvas(canvas,deg){
  const rad=deg*Math.PI/180, s=Math.abs(Math.sin(rad)), c=Math.abs(Math.cos(rad));
  const w=canvas.width, h=canvas.height;
  const nw=Math.round(w*c+h*s), nh=Math.round(w*s+h*c);
  const out=document.createElement('canvas'); out.width=nw; out.height=nh;
  const ctx=out.getContext('2d'); ctx.imageSmoothingQuality='high';
  ctx.translate(nw/2,nh/2); ctx.rotate(rad); ctx.drawImage(canvas,-w/2,-h/2); return out;
}
function ensureLandscape(canvas){
  return (canvas.height>canvas.width*1.15) ? rotateCanvas(canvas,90) : canvas;
}

// ---- OpenCV.js lazy load ----
let _cvPromise=null;
function loadOpenCV(){
  if(window.cv && window.cv.Mat) return Promise.resolve(window.cv);
  if(_cvPromise) return _cvPromise;
  _cvPromise=new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://docs.opencv.org/4.10.0/opencv.js'; s.async=true;
    s.onload=()=>{
      const t=setInterval(()=>{ if(window.cv && window.cv.Mat){ clearInterval(t); resolve(window.cv); } },60);
      setTimeout(()=>{ clearInterval(t); if(!(window.cv&&window.cv.Mat)) reject(new Error('opencv init timeout')); },20000);
    };
    s.onerror=()=>reject(new Error('opencv load failed'));
    document.head.appendChild(s);
  }).catch(e=>{ _cvPromise=null; throw e; });
  return _cvPromise;
}
function _orderCorners(pts){
  const bySum=[...pts].sort((a,b)=>(a.x+a.y)-(b.x+b.y));
  const byDiff=[...pts].sort((a,b)=>(a.x-a.y)-(b.x-b.y));
  return [bySum[0], byDiff[3], bySum[3], byDiff[0]]; // tl, tr, br, bl
}
// Εντοπισμός μεγαλύτερου τετράπλευρου (κάρτα) και perspective warp -> canvas ή null
function warpLargestQuad(canvas){
  const cv=window.cv; if(!cv||!cv.Mat) return null;
  let src=cv.imread(canvas), gray=new cv.Mat(), blur=new cv.Mat(), edges=new cv.Mat();
  let best=null;
  try{
    cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(gray,blur,new cv.Size(5,5),0);
    cv.Canny(blur,edges,50,150);
    const k=cv.getStructuringElement(cv.MORPH_RECT,new cv.Size(5,5));
    cv.dilate(edges,edges,k); k.delete();
    const contours=new cv.MatVector(), hierarchy=new cv.Mat();
    cv.findContours(edges,contours,hierarchy,cv.RETR_EXTERNAL,cv.CHAIN_APPROX_SIMPLE);
    const imgArea=canvas.width*canvas.height; let bestArea=0;
    for(let i=0;i<contours.size();i++){
      const c=contours.get(i); const area=cv.contourArea(c);
      if(area>imgArea*0.18){
        const peri=cv.arcLength(c,true); const approx=new cv.Mat();
        cv.approxPolyDP(c,approx,0.02*peri,true);
        if(approx.rows===4 && area>bestArea){ if(best) best.delete(); best=approx; bestArea=area; }
        else approx.delete();
      }
      c.delete();
    }
    contours.delete(); hierarchy.delete();
    if(!best) return null;
    const pts=[]; for(let i=0;i<4;i++) pts.push({x:best.data32S[i*2], y:best.data32S[i*2+1]});
    const [tl,tr,br,bl]=_orderCorners(pts);
    const outW=Math.round(Math.max(Math.hypot(br.x-bl.x,br.y-bl.y),Math.hypot(tr.x-tl.x,tr.y-tl.y)));
    const outH=Math.round(Math.max(Math.hypot(tr.x-br.x,tr.y-br.y),Math.hypot(tl.x-bl.x,tl.y-bl.y)));
    if(outW<60||outH<60) return null;
    const srcTri=cv.matFromArray(4,1,cv.CV_32FC2,[tl.x,tl.y,tr.x,tr.y,br.x,br.y,bl.x,bl.y]);
    const dstTri=cv.matFromArray(4,1,cv.CV_32FC2,[0,0,outW,0,outW,outH,0,outH]);
    const M=cv.getPerspectiveTransform(srcTri,dstTri);
    const dst=new cv.Mat();
    cv.warpPerspective(src,dst,M,new cv.Size(outW,outH),cv.INTER_LINEAR,cv.BORDER_CONSTANT,new cv.Scalar(255,255,255,255));
    const out=document.createElement('canvas'); out.width=outW; out.height=outH; cv.imshow(out,dst);
    srcTri.delete(); dstTri.delete(); M.delete(); dst.delete();
    return out;
  }catch(e){ return null; }
  finally{ if(best) try{best.delete();}catch(e){} src.delete(); gray.delete(); blur.delete(); edges.delete(); }
}

// Προεπεξεργασία για OCR: μεγέθυνση + grayscale + τέντωμα αντίθεσης (min-max)
function preprocessOCR(canvas,targetW){
  targetW=targetW||1800;
  let w=canvas.width,h=canvas.height;
  const scale=Math.min(3, Math.max(1, targetW/w));
  const cw=Math.round(w*scale), ch=Math.round(h*scale);
  const cv2=document.createElement('canvas'); cv2.width=cw; cv2.height=ch;
  const ctx=cv2.getContext('2d'); ctx.imageSmoothingQuality='high'; ctx.drawImage(canvas,0,0,cw,ch);
  let im; try{ im=ctx.getImageData(0,0,cw,ch); }catch(e){ return cv2.toDataURL('image/png'); }
  const d=im.data; const n=cw*ch; const g=new Uint8ClampedArray(n);
  let min=255,max=0;
  for(let i=0,p=0;i<d.length;i+=4,p++){ const v=(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114)|0; g[p]=v; if(v<min)min=v; if(v>max)max=v; }
  const range=Math.max(1,max-min);
  for(let i=0,p=0;i<d.length;i+=4,p++){ let v=((g[p]-min)/range)*255; v=v<0?0:v>255?255:v; d[i]=d[i+1]=d[i+2]=v; }
  ctx.putImageData(im,0,0);
  return cv2.toDataURL('image/png');
}

// Πλήρης επεξεργασία μιας όψης: επιστρέφει {display, ocr}
async function processCardImage(file){
  const bmp=await loadBitmap(file);
  const base=drawToCanvas(bmp,2000);
  let cropped=null;
  try{
    // Guard: αν το OpenCV αργήσει να φορτώσει, συνέχισε χωρίς auto-crop.
    const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error('cv timeout')),18000));
    await Promise.race([loadOpenCV(),timeout]);
    cropped=warpLargestQuad(base);
  }catch(e){ cropped=null; }
  let card=ensureLandscape(cropped||base);
  return { display:canvasToJpeg(card,1400,0.85), ocr:preprocessOCR(card,1800), cropped:!!cropped };
}

// Περιστροφή αποθηκευμένης όψης (dataURLs) κατά 90°
async function rotateSide(side){
  const load=src=>new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; });
  const rot=async src=>{ const img=await load(src); const c=document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight; c.getContext('2d').drawImage(img,0,0); const r=rotateCanvas(c,90); return r; };
  const rd=await rot(side.display); const ro=await rot(side.ocr);
  return { display:canvasToJpeg(rd,1400,0.85), ocr:ro.toDataURL('image/png'), cropped:side.cropped };
}

/* ---------- OCR ---------- */
let _worker=null, _workerLang=null;
async function ensureWorker(onProgress){
  if(typeof Tesseract==='undefined') throw new Error('Η βιβλιοθήκη OCR δεν φορτώθηκε (έλεγξε τη σύνδεση στο διαδίκτυο).');
  if(_worker) return _worker;
  _worker=await Tesseract.createWorker('ell+eng',1,{
    logger:m=>{ if(onProgress) onProgress(m); }
  });
  try{
    await _worker.setParameters({
      preserve_interword_spaces:'1',
      tessedit_pageseg_mode: (Tesseract.PSM && Tesseract.PSM.AUTO) || '3'
    });
  }catch(e){}
  _workerLang='ell+eng';
  return _worker;
}
async function runOCR(dataURL,onProgress){
  const w=await ensureWorker(onProgress);
  const {data}=await w.recognize(dataURL);
  return data.text||'';
}

/* ---------- Parser στοιχείων ---------- */
function parseCard(text){
  const raw=(text||'').replace(/\r/g,'');
  const lines=raw.split('\n').map(l=>l.trim()).filter(Boolean);

  // Email
  const emails=[...new Set((raw.match(/[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}/g)||[])
    .map(e=>e.toLowerCase()))];

  // Website (χωρίς να πιάνει τα emails ή σκέτα domain παρόχων email)
  const emailDomains=emails.map(e=>(e.split('@')[1]||'').toLowerCase());
  const freeProviders=['gmail.com','googlemail.com','yahoo.com','yahoo.gr','hotmail.com','hotmail.gr',
    'outlook.com','outlook.gr','live.com','icloud.com','gmx.com','me.com','aol.com','windowslive.com'];
  const siteCands=(raw.match(/\b((https?:\/\/)?(www\.)[^\s]+|https?:\/\/[^\s]+|[A-Za-z0-9\-]+\.(gr|com|net|eu|org|info|io|co)(\.[a-z]{2})?)\b/gi)||[])
    .map(s=>s.replace(/[.,;)]+$/,''))
    .filter(s=>!s.includes('@'))
    .filter(s=>!/^\d/.test(s));
  const seenHost=new Set(); const sites=[];
  for(const s of siteCands){
    const host=s.replace(/^https?:\/\//i,'').replace(/^www\./i,'').toLowerCase().split('/')[0];
    if(freeProviders.includes(host)) continue;                 // gmail.com κ.λπ. δεν είναι ιστοσελίδα
    const wasUrl=/^https?:\/\//i.test(s)||/^www\./i.test(s);
    if(!wasUrl && emailDomains.includes(host)) continue;       // σκέτο domain ίδιο με το email
    if(seenHost.has(host)) continue; seenHost.add(host);
    sites.push(s);
  }

  // Τηλέφωνα (Ελλάδα): εντοπισμός υποψηφίων ακολουθιών ψηφίων
  const phoneCands=raw.match(/(\+?[ \t]?30[ \t.\-]?)?(\(?\d{2,4}\)?[ \t.\-]?){2,5}\d{2,4}/g)||[];
  const phones=[];
  for(let c of phoneCands){
    const hasPlus=/\+\s?30/.test(c);
    let digits=c.replace(/\D/g,'');
    if(hasPlus && digits.startsWith('30')) digits=digits.slice(2);
    if(digits.length===10 && /^[2-9]/.test(digits)){
      const prefix=hasPlus?'+30 ':'';
      // Κινητά (69xxxxxxxx): 4-3-3 · Σταθερά: 3-3-4
      const grouped = digits.startsWith('69')
        ? digits.replace(/(\d{4})(\d{3})(\d{3})/,'$1 $2 $3')
        : digits.replace(/(\d{3})(\d{3})(\d{4})/,'$1 $2 $3');
      const val=prefix+grouped;
      if(!phones.some(p=>p.replace(/\D/g,'').endsWith(digits))) phones.push(val);
    }
  }

  // Διεύθυνση: γραμμές με λέξεις-κλειδιά ή ταχ. κώδικα, εξαιρώντας γραμμές τηλεφώνου
  const addrKeys=/(οδος|οδ\.|λεωφ|λεωφορος|πλατεια|αριθμ|αρ\.|τ\.?κ|τ\.?θ|τκ|street|str\.|ave|avenue|address|διευθυνση|περιοχη)/i;
  const phoneLineRe=/(τηλ|κιν|tel|fax|φαξ|mob|mobile)/i;
  const tkRe=/(?<!\d)\d{3}\s\d{2}(?!\d)|\b\d{5}\b/; // Τ.Κ. τύπου "271 00" ή "27100"
  const addrLines=lines.filter(l=>{
    if(/@/.test(l) || /www\.|https?:\/\//i.test(l)) return false;
    if(phoneLineRe.test(l)) return false;
    const hasKey=addrKeys.test(l);
    const hasTK=tkRe.test(l);
    if(!hasKey && !hasTK) return false;
    if(!hasKey && (l.replace(/\D/g,'').length>=8)) return false; // πολλά ψηφία -> μάλλον τηλέφωνο
    return true;
  });
  const address=addrLines.join(', ').replace(/\s{2,}/g,' ').trim();

  // Όνομα / Εταιρεία: υποψήφιες γραμμές (χωρίς email/site/τηλ/διευθυνση)
  const isNoise=l=>{
    if(/@/.test(l)) return true;
    if(/www\.|https?:\/\//i.test(l)) return true;
    if(addrKeys.test(l)) return true;
    const d=(l.match(/\d/g)||[]).length;
    if(d>=6) return true; // πιθανό τηλέφωνο/αριθμός
    if(l.replace(/[^A-Za-zΑ-Ωα-ωΆ-Ώά-ώ]/g,'').length<3) return true;
    return false;
  };
  const nameCands=lines.filter(l=>!isNoise(l));
  // Το πρώτο "καθαρό" -> όνομα/εταιρεία, το δεύτερο -> το άλλο
  let name = nameCands[0]||'';
  let company = nameCands[1]||'';
  // Αν μία γραμμή είναι ΟΛΟ κεφαλαία (συχνά εταιρεία) και η άλλη όχι, βάλε εταιρεία στα κεφαλαία
  const upperRatio=s=>{ const L=s.replace(/[^A-Za-zΑ-Ωα-ω]/g,''); if(!L) return 0; const U=s.replace(/[^A-ZΑ-Ω]/g,'').length; return U/L.length; };
  if(company && upperRatio(company)>0.7 && upperRatio(name)<0.7){ /* κράτα ως έχει: name=άτομο, company=εταιρεία */ }
  else if(upperRatio(name)>0.7 && company && upperRatio(company)<0.7){ const t=name; name=company; company=t; }

  return { name, company, emails, phones, sites, address, rawText:raw,
           suggestedCategory: detectCategory(raw) };
}

function renderScan(){
  viewEl.innerHTML=`
    <div class="backrow"><button class="backbtn" onclick="cancelScan()">‹ Ακύρωση</button></div>
    <div class="viewtitle">Σάρωση κάρτας</div>
    <div class="viewsub">Φωτογράφισε ή διάλεξε τις δύο όψεις της κάρτας. Η κάρτα εντοπίζεται, <b>κόβεται και ισιώνει αυτόματα</b>, και το κείμενο διαβάζεται (OCR) τοπικά στη συσκευή. Με το ⟳ μπορείς να περιστρέψεις αν χρειάζεται.</div>

    <div class="sides">
      <label class="side" id="sideFront">
        <span class="tag-side">Μπροστά</span>
        <span class="side-emoji">📷</span>
        <span class="side-label">Μπροστινή όψη</span>
        <span class="side-hint">Πάτησε για λήψη</span>
        <input type="file" accept="image/*" capture="environment" class="hidden" id="inpFront">
      </label>
      <label class="side" id="sideBack">
        <span class="tag-side">Πίσω</span>
        <span class="side-emoji">📷</span>
        <span class="side-label">Πίσω όψη</span>
        <span class="side-hint">Προαιρετικό</span>
        <input type="file" accept="image/*" capture="environment" class="hidden" id="inpBack">
      </label>
    </div>

    <div id="ocrArea"></div>

    <button class="btn btn-primary" id="readBtn" disabled>🔎 Ανάγνωση στοιχείων</button>
    <button class="btn btn-ghost" id="manualFromScan" style="margin-top:10px">✍️ Εισαγωγή χωρίς κάρτα</button>
    <div class="hint-inline">💡 Συμβουλή: καλός φωτισμός και σταθερό χέρι δίνουν καλύτερη ανάγνωση. Μπορείς να διορθώσεις όλα τα στοιχεία στο επόμενο βήμα.</div>
  `;
  const fillSide=(sideId,which)=>{
    const el=$('#'+sideId); const side=scanState[which];
    el.classList.add('filled');
    el.querySelector('.side-emoji')?.remove();
    el.querySelector('.side-label')?.remove();
    el.querySelector('.side-hint')?.remove();
    el.querySelector('.side-proc')?.remove();
    let img=el.querySelector('img');
    if(!img){ img=document.createElement('img'); el.appendChild(img); }
    img.src=side.display;
    if(!el.querySelector('.retake')){
      const r=document.createElement('span'); r.className='retake'; r.textContent='Αλλαγή'; el.appendChild(r);
    }
    if(!el.querySelector('.rotbtn')){
      const rot=document.createElement('button'); rot.type='button'; rot.className='rotbtn'; rot.textContent='⟳';
      rot.title='Περιστροφή 90°';
      rot.onclick=async ev=>{ ev.preventDefault(); ev.stopPropagation();
        try{ scanState[which]=await rotateSide(scanState[which]); fillSide(sideId,which); }
        catch(e){ toast('Σφάλμα περιστροφής',true); } };
      el.appendChild(rot);
    }
    $('#readBtn').disabled = !scanState.front;
  };
  const showProcessing=(sideId)=>{
    const el=$('#'+sideId); el.classList.add('filled');
    if(!el.querySelector('.side-proc')){
      const p=document.createElement('div'); p.className='side-proc';
      p.innerHTML='<span class="spinner"></span><span>Επεξεργασία…</span>'; el.appendChild(p);
    }
  };
  const handle=(input,which,sideId)=>{
    input.onchange=async e=>{
      const f=e.target.files&&e.target.files[0]; if(!f) return;
      showProcessing(sideId);
      try{
        scanState[which]=await processCardImage(f);
        fillSide(sideId,which);
        if(!scanState[which].cropped && which==='front')
          toast('Δεν εντοπίστηκε αυτόματα η κάρτα — αν χρειάζεται, χρησιμοποίησε ⟳ ή «Αλλαγή».');
      }catch(err){ console.error(err); toast('Σφάλμα φόρτωσης εικόνας',true);
        $('#'+sideId+' .side-proc')?.remove(); }
    };
  };
  // Επαναφορά αν επιστρέψαμε
  if(scanState.front) fillSide('sideFront','front');
  if(scanState.back) fillSide('sideBack','back');
  $('#readBtn').disabled = !scanState.front;

  handle($('#inpFront'),'front','sideFront');
  handle($('#inpBack'),'back','sideBack');
  $('#readBtn').onclick=doRead;
  $('#manualFromScan').onclick=manualEntry;
}

/* Δημιουργεί μια απλή λευκή «κάρτα» (εικόνα JPEG) από τα στοιχεία,
   ώστε κάθε χειροκίνητη εγγραφή να έχει και εικόνα στη βάση. */
function _roundRect(ctx,x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
async function generateCardImage(d){
  try{ if(document.fonts&&document.fonts.ready) await document.fonts.ready; }catch(e){}
  const W=1000;
  const cv=document.createElement('canvas'); const ctx=cv.getContext('2d');
  const FONT=(w,s)=>`${w} ${s}px 'IBM Plex Sans', Arial, Helvetica, sans-serif`;
  const PADL=70, PADR=60, maxW=W-PADL-PADR;
  const fit=(txt,mw)=>{ if(!txt) return ''; let t=String(txt);
    if(ctx.measureText(t).width<=mw) return t;
    while(t.length>1 && ctx.measureText(t+'…').width>mw) t=t.slice(0,-1); return t+'…'; };
  const wrapLines=(txt,font,mw)=>{ ctx.font=font; const words=String(txt).split(/\s+/); const out=[]; let line='';
    for(const w of words){ const t=line?line+' '+w:w;
      if(ctx.measureText(t).width>mw && line){ out.push(line); line=w; } else line=t; }
    if(line) out.push(line); return out.slice(0,3); };

  // Λίστα πεδίων προς σχεδίαση
  const fields=[];
  (d.phones||[]).filter(Boolean).forEach(p=>fields.push(['Τηλέφωνο',p]));
  (d.emails||[]).filter(Boolean).forEach(e=>fields.push(['Email',e]));
  (d.sites||[]).filter(Boolean).forEach(s=>fields.push(['Ιστοσελίδα',s]));
  if(d.address) fields.push(['Διεύθυνση',d.address]);
  if(d.notes) fields.push(['Σημειώσεις',d.notes]);

  // Προϋπολογισμός ύψους
  const head=d.company||d.name||'Χωρίς όνομα';
  const second=d.company? d.name : d.title;
  let headH=110 + 8;
  if(second) headH+=48;
  if(d.company && d.title) headH+=38;
  headH+=46+44; // διαχωριστικό + κενό
  const rowLines=fields.map(([,val])=>wrapLines(val,FONT(500,27),maxW));
  let rowsH=0; rowLines.forEach(ls=>{ rowsH += 32 + ls.length*36 + 16; });
  const H=Math.max(600, Math.round(headH + rowsH + 70));

  cv.width=W; cv.height=H; // ορισμός μεγέθους (μηδενίζει το ctx)
  // Φόντο + πλαίσιο
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#e7e9ec'; ctx.lineWidth=2; ctx.strokeRect(1,1,W-2,H-2);
  const grad=ctx.createLinearGradient(0,0,W,0); grad.addColorStop(0,'#ff9a3c'); grad.addColorStop(1,'#ff7a18');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,16); ctx.fillRect(0,0,12,H);

  // Chip κατηγορίας πάνω δεξιά
  if(d.category){
    ctx.font=FONT(600,20); const label=catEmoji(d.category)+' '+d.category;
    const tw=ctx.measureText(label).width; const chipW=Math.min(tw+34,420), chipH=42, cx=W-PADR-chipW, cy=42;
    ctx.fillStyle='#fff4ea'; _roundRect(ctx,cx,cy,chipW,chipH,21); ctx.fill();
    ctx.strokeStyle='#ffd2a6'; ctx.lineWidth=1.5; _roundRect(ctx,cx,cy,chipW,chipH,21); ctx.stroke();
    ctx.fillStyle='#c2560a'; ctx.textBaseline='middle'; ctx.fillText(fit(label,chipW-30),cx+17,cy+chipH/2+1);
    ctx.textBaseline='alphabetic';
  }

  // Κεφαλίδα
  let y=118;
  ctx.fillStyle='#12161c'; ctx.font=FONT(700,48); ctx.fillText(fit(head,maxW-200),PADL,y);
  if(second){ y+=48; ctx.fillStyle='#c2560a'; ctx.font=FONT(600,30); ctx.fillText(fit(second,maxW-200),PADL,y); }
  if(d.company && d.title){ y+=38; ctx.fillStyle='#6b7580'; ctx.font=FONT(500,26); ctx.fillText(fit(d.title,maxW-200),PADL,y); }

  // Διαχωριστικό
  y+=42; ctx.strokeStyle='#ececec'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(PADL,y); ctx.lineTo(W-PADR,y); ctx.stroke();
  y+=48;

  // Πεδία
  fields.forEach(([lbl],idx)=>{
    const lblUp=lbl.toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,''); // κεφαλαία χωρίς τόνους
    ctx.fillStyle='#ff7a18'; ctx.font=FONT(600,17); ctx.fillText(lblUp,PADL,y);
    ctx.fillStyle='#20262e'; ctx.font=FONT(500,27);
    let ly=y+32; for(const line of rowLines[idx]){ ctx.fillText(line,PADL,ly); ly+=36; }
    y=ly+16;
  });

  // Υποσέλιδο
  ctx.fillStyle='#9aa3ad'; ctx.font=FONT(500,18); ctx.textAlign='right';
  ctx.fillText('Δημιουργήθηκε με CardScan · CG apps', W-PADR, H-26); ctx.textAlign='left';

  return cv.toDataURL('image/jpeg',0.92);
}

async function doRead(){
  if(!scanState.front){ toast('Φωτογράφισε τουλάχιστον τη μπροστινή όψη',true); return; }
  const area=$('#ocrArea'); const btn=$('#readBtn'); btn.disabled=true;
  area.innerHTML=`<div class="ocr-box">
      <div class="ocr-status"><span class="spinner"></span><span id="ocrMsg">Προετοιμασία OCR…</span></div>
      <div class="bar"><i id="ocrBar"></i></div>
    </div>`;
  const setMsg=(m,p)=>{ const el=$('#ocrMsg'); if(el) el.textContent=m; if(p!=null){ const b=$('#ocrBar'); if(b) b.style.width=Math.round(p*100)+'%'; } };
  const prog=m=>{
    if(m.status==='recognizing text') setMsg('Ανάγνωση κειμένου… '+Math.round(m.progress*100)+'%', m.progress);
    else if(m.status==='loading tesseract core'||m.status==='initializing tesseract') setMsg('Φόρτωση μηχανής OCR…',0.05);
    else if(/language|traineddata/i.test(m.status||'')) setMsg('Λήψη ελληνικού λεξικού (μία φορά)…',0.1);
    else if(m.status) setMsg(m.status+'…');
  };
  try{
    let text='';
    setMsg('Ανάγνωση μπροστινής όψης…',0.02);
    text += await runOCR(scanState.front.ocr,prog);
    if(scanState.back){
      setMsg('Ανάγνωση πίσω όψης…',0.02);
      text += '\n'+await runOCR(scanState.back.ocr,prog);
    }
    const parsed=parseCard(text);
    editDraft={
      id:'', category:parsed.suggestedCategory||'',
      name:parsed.name, company:parsed.company, title:'',
      phones:parsed.phones.length?parsed.phones:[''],
      emails:parsed.emails.length?parsed.emails:[''],
      sites:parsed.sites, address:parsed.address, notes:'',
      rawText:parsed.rawText,
      imageFront:scanState.front.display, imageBack:scanState.back?scanState.back.display:null,
      createdAt:0, updatedAt:0
    };
    nav('edit');
  }catch(err){
    console.error(err);
    area.innerHTML='';
    toast(err.message||'Σφάλμα OCR. Μπορείς να συμπληρώσεις τα στοιχεία χειροκίνητα.',true);
    // Επίτρεψε χειροκίνητη καταχώρηση ακόμη κι αν αποτύχει το OCR
    editDraft={ id:'',category:'',name:'',company:'',title:'',phones:[''],emails:[''],sites:[],
      address:'',notes:'',rawText:'',
      imageFront:scanState.front?scanState.front.display:null,
      imageBack:scanState.back?scanState.back.display:null,createdAt:0,updatedAt:0 };
    setTimeout(()=>nav('edit'),400);
  }finally{ btn.disabled=false; }
}

async function saveCard(){
  const getMulti=id=>$$('#'+id+' input').map(i=>i.value.trim()).filter(Boolean);
  const cat=$('#fCategory').value;
  if(!cat){ toast('Επίλεξε κατηγορία',true); $('#fCategory').focus(); return; }
  const d=editDraft;
  const now=Date.now();
  const rec={
    id: d.id || ('c_'+now+'_'+Math.random().toString(36).slice(2,7)),
    category:cat,
    name:$('#fName').value.trim(),
    company:$('#fCompany').value.trim(),
    title:$('#fTitle').value.trim(),
    phones:getMulti('phones'),
    emails:getMulti('emails'),
    sites:getMulti('sites'),
    address:$('#fAddress').value.trim(),
    notes:$('#fNotes').value.trim(),
    rawText:$('#fRaw')?$('#fRaw').value:d.rawText,
    imageFront:d.imageFront||null,
    imageBack:d.imageBack||null,
    generated:!!d.generated,
    createdAt:d.createdAt||now,
    updatedAt:now
  };
  try{
    // Χωρίς φωτογραφία (χειροκίνητη εγγραφή) ή επεξεργασία παραγόμενης κάρτας
    // -> (ανα)δημιούργησε τη λευκή κάρτα ως εικόνα.
    if(!rec.imageFront || rec.generated){
      const sb=$('#saveBtn'); if(sb){ sb.disabled=true; sb.textContent='🖼️ Δημιουργία κάρτας…'; }
      rec.imageFront=await generateCardImage(rec);
      rec.generated=true;
    }
    await dbPut(rec);
    scanState={front:null,back:null}; editDraft=null;
    toast('✅ Αποθηκεύτηκε στην κατηγορία «'+cat+'»');
    nav('card/'+encodeURIComponent(rec.id));
  }catch(err){ console.error(err); toast('Σφάλμα αποθήκευσης',true);
    const sb=$('#saveBtn'); if(sb){ sb.disabled=false; sb.textContent='💾 Αποθήκευση'; } }
}

    </div>
    <div class="btn-row" style="margin-top:20px">
      <button class="btn" id="editBtn">✏️ Επεξεργασία</button>
      <button class="btn" id="vcardBtn">📤 Εξαγωγή vCard</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-danger" id="delBtn">🗑️ Διαγραφή</button>
    </div>
    <div class="hint-inline">Καταχωρήθηκε: ${new Date(c.createdAt).toLocaleString('el-GR')}${c.updatedAt&&c.updatedAt!==c.createdAt?' · Ενημερώθηκε: '+new Date(c.updatedAt).toLocaleString('el-GR'):''}</div>
  `;
  $('#backD').onclick=()=>history.length>1?history.back():nav('');
  $$('[data-zoom]').forEach(img=>img.onclick=()=>openLightbox(img.src));
  $('#editBtn').onclick=()=>{ editDraft={...c, phones:c.phones&&c.phones.length?[...c.phones]:[''], emails:c.emails&&c.emails.length?[...c.emails]:[''], sites:c.sites?[...c.sites]:[]}; nav('edit'); };
  $('#vcardBtn').onclick=()=>exportVCard(c);
  $('#delBtn').onclick=async()=>{
    if(confirm('Διαγραφή αυτής της κάρτας; Η ενέργεια δεν αναιρείται.')){
      await dbDel(c.id); toast('Διαγράφηκε'); nav('cat/'+encodeURIComponent(c.category));
    }
  };
}

/* ---- vCard export ---- */
function exportVCard(c){
  const lines=['BEGIN:VCARD','VERSION:3.0'];
  if(c.name) lines.push('FN:'+c.name);
  if(c.name){ const parts=c.name.split(/\s+/); lines.push('N:'+(parts.slice(1).join(' ')||'')+';'+(parts[0]||'')+';;;'); }
  if(c.company) lines.push('ORG:'+c.company);
  if(c.title) lines.push('TITLE:'+c.title);
  (c.phones||[]).forEach(p=>lines.push('TEL;TYPE=CELL:'+p.replace(/\s/g,'')));
  (c.emails||[]).forEach(e=>lines.push('EMAIL:'+e));
  (c.sites||[]).forEach(s=>lines.push('URL:'+(/^https?:\/\//i.test(s)?s:'https://'+s)));
  if(c.address) lines.push('ADR:;;'+c.address.replace(/\n/g,' ')+';;;;');
  if(c.notes) lines.push('NOTE:'+c.notes.replace(/\n/g,'\\n'));
  lines.push('CATEGORIES:'+(c.category||''));
  lines.push('END:VCARD');
  const blob=new Blob([lines.join('\r\n')],{type:'text/vcard'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=(c.name||c.company||'card').replace(/[^\wͰ-Ͽ]+/g,'_')+'.vcf';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast('Εξήχθη vCard (.vcf)');
}

/* ---- Menu (backup / restore) ---- */
$('#menuBtn').onclick=async()=>{
  const choice=prompt('CardScan · Επιλογές\n\n1 = Εξαγωγή αντιγράφου ασφαλείας (JSON)\n2 = Εισαγωγή αντιγράφου (JSON)\n\nΓράψε 1 ή 2:');
  if(choice==='1') await exportBackup();
  else if(choice==='2') importBackup();
};
async function exportBackup(){
  const cards=await dbAll();
  const data={app:'CardScan',maker:'CG apps',exportedAt:new Date().toISOString(),categories:getCategories(),cards};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='cardscan-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast('Εξήχθη αντίγραφο ('+cards.length+' κάρτες)');
}
function importBackup(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
  inp.onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{
      const data=JSON.parse(await f.text());
      const cards=Array.isArray(data)?data:(data.cards||[]);
      if(data.categories) data.categories.filter(c=>!DEFAULT_CATEGORIES.includes(c)&&c!==OTHER).forEach(addCustomCategory);
      let n=0; for(const c of cards){ if(c&&c.id){ await dbPut(c); n++; } }
      toast('Εισήχθησαν '+n+' κάρτες'); router();
    }catch(err){ toast('Μη έγκυρο αρχείο',true); }
  };
  inp.click();
}

/* ---- FAB ---- */
$('#fab').onclick=()=>{ scanState={front:null,back:null}; nav('scan'); };

/* ---- Service worker ---- */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('cardscan-sw.js').catch(()=>{}));
}

/* ---- Boot ---- */
router();
</script>
