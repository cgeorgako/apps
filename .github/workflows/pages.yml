name: Deploy to GitHub Pages

# Δημοσιεύει όλο τον φάκελο του repo (τα HTML εργαλεία + CardScan PWA)
# στο GitHub Pages, σε κάθε push στο main. Μπορεί να τρέξει και χειροκίνητα.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Δικαιώματα που χρειάζεται το επίσημο deploy του Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Επιτρέπουμε ένα deployment τη φορά· δεν ακυρώνουμε τρέχον deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement: true ενεργοποιεί αυτόματα το Pages αν δεν είναι ήδη ενεργό
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
